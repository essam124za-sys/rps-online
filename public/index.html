<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="/manifest.json">
<title>ألعاب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
:root{--bg:#fdf6e3;--ink:#14213d;--card:#fff;--a:#2ec4b6;--mut:#5b6478;--line:#d9d2bd}
@media (prefers-color-scheme:dark){:root{--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;--line:#33466f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
h1{font-size:1.6rem;font-weight:800;margin:0;padding:14px 16px 4px}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:inherit;font-weight:800;font-size:1.05rem;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--a)}
.tabs button:focus-visible{outline:3px solid var(--a);outline-offset:-3px}
main{max-width:460px;margin:0 auto;padding:16px}
#list{display:grid;gap:12px}
.note{margin:0;color:var(--mut);font-size:.95rem}
.game{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;color:var(--ink);text-decoration:none;font-size:1.3rem;font-weight:800}
.game span{font-size:2rem}
.game:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
  <div class="top">
    <h1>ألعاب</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <main>
    <div id="list"></div>
  </main>
<script>
// التبويبات
const TABS = [
  ["all", "الكل"],
  ["friends", "ألعاب مع أصدقائك"],
  ["solo", "ألعاب ذكاء لواحدك"],
  ["offline", "ألعاب بدون نت"]
];
// كل لعبة: [التبويب بتاعها، الشكل، الاسم، الرابط]
const GAMES = [
  ["friends", "✊✋✌️", "حجر ورقة مقص", "/rps.html"],
  ["friends", "❌⭕", "إكس أو", "/xo.html"],
  ["solo", "🍓", "وصّل الفواكه", "/fruits.html"],
  ["solo", "⚡", "تحدي الحساب السريع", "/math.html"],
  ["offline", "🧐", "ده إيه؟", "/quiz.html"]
];

const tabsEl = document.getElementById("tabs");
const listEl = document.getElementById("list");

function show(id) {
  tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  listEl.innerHTML = "";
  if (id === "offline") {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = "الألعاب دي بتشتغل بدون إنترنت، بعد ما تفتح التطبيق مرة بنت.";
    listEl.appendChild(p);
  }
  GAMES.filter(g => id === "all" || g[0] === id).forEach(g => {
    const a = document.createElement("a");
    a.className = "game";
    a.href = g[3];
    a.innerHTML = "<span>" + g[1] + "</span>" + g[2];
    listEl.appendChild(a);
  });
}

TABS.forEach(t => {
  const b = document.createElement("button");
  b.dataset.t = t[0];
  b.textContent = t[1];
  b.onclick = () => show(t[0]);
  tabsEl.appendChild(b);
});
show("all");

// بيحفظ الألعاب على التليفون عشان تشتغل بدون نت
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}
</script>
</body>
</html>
