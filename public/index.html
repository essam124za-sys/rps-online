<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعاب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
:root{--bg:#fdf6e3;--ink:#14213d;--card:#fff;--a:#2ec4b6;--mut:#5b6478;--line:#d9d2bd}
@media (prefers-color-scheme:dark){:root{--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;--line:#33466f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
h1{font-size:1.6rem;font-weight:800;margin:0;padding:14px 16px 4px}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font:inherit;font-weight:800;font-size:1.05rem;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--a)}
.tabs button:focus-visible{outline:3px solid var(--a);outline-offset:-3px}
main{max-width:460px;margin:0 auto;padding:16px}
section{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;color:var(--ink);text-decoration:none;font-size:1.3rem;font-weight:800}
.game span{font-size:2rem}
.game:focus-visible{outline:3px solid var(--a);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
  <div class="top">
    <h1>ألعاب</h1>
    <div class="tabs">
      <button data-t="friends" class="on">ألعاب مع أصدقائك</button>
      <button data-t="solo">ألعاب ذكاء لواحدك</button>
    </div>
  </div>
  <main>
    <section id="friends">
      <a class="game" href="/rps.html"><span>✊✋✌️</span>حجر ورقة مقص</a>
      <a class="game" href="/xo.html"><span>❌⭕</span>إكس أو</a>
    </section>
    <section id="solo" hidden>
      <a class="game" href="/fruits.html"><span>🍓</span>وصّل الفواكه</a>
      <a class="game" href="/math.html"><span>⚡</span>تحدي الحساب السريع</a>
    </section>
  </main>
<script>
const tabs = document.querySelectorAll(".tabs button");
function show(id) {
  tabs.forEach(b => b.classList.toggle("on", b.dataset.t === id));
  document.getElementById("friends").hidden = id !== "friends";
  document.getElementById("solo").hidden = id !== "solo";
}
tabs.forEach(b => b.onclick = () => show(b.dataset.t));
</script>
</body>
</html>
