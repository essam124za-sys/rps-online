<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق العربيات</title>
<style>
:root{--bg:#fdf6e3;--ink:#14213d;--card:#fff;--b:#ff5d8f;--mut:#5b6478}
@media (prefers-color-scheme:dark){:root{--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px;text-align:center}
h1{font-size:2rem;font-weight:800;margin:4px 0 12px}
p{margin:0 0 12px}
a{color:var(--mut)}
.setup{display:grid;gap:10px;margin-top:16px}
.setup label{text-align:start;font-weight:800}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font-size:1.15rem}
button{font:inherit;color:var(--ink);cursor:pointer}
.act{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:16px;font-size:1.2rem;font-weight:800}
.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.err{color:var(--b);font-weight:800;min-height:1.5em;margin:0}
.code{font-size:4rem;font-weight:800;letter-spacing:.2em;direction:ltr;margin:10px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
[hidden]{display:none!important}

#s-race{position:fixed;inset:0;display:flex;flex-direction:column;background:#222;z-index:10}
#top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--bg);color:var(--ink);font-weight:800}
#top button{background:transparent;border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font:inherit;color:var(--ink)}
#score{direction:ltr;font-size:1.2rem}
#track{flex:1;display:flex;gap:4px;position:relative;touch-action:none;user-select:none;-webkit-user-select:none;direction:ltr;background:#222}
.lane{flex:1;position:relative;overflow:hidden;background-image:linear-gradient(to bottom,rgba(255,255,255,.6) 0 22px,transparent 22px 46px);background-size:6px 46px;background-repeat:repeat-y;background-position:50% 0}
.l0{background-color:#e0535c}
.l1{background-color:#3fae5a}
.finish{position:absolute;top:0;left:0;right:0;height:28px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/28px 28px}
.lname{position:absolute;top:34px;left:0;right:0;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 4px #000;font-size:1.05rem;padding:0 4px}
.car{position:absolute;bottom:40px;left:50%;margin-left:-22px;transition:transform .08s linear}
.hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 1px 4px #000}
#overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:5rem;font-weight:800;color:#fff;text-shadow:0 3px 12px #000;text-align:center;padding:16px;direction:rtl}
#overlay.small{font-size:2.2rem}
#after{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;z-index:3}
#after .act{background:#fff;color:#14213d}
</style>
</head>
<body>
<main id="menu">
  <h1>سباق العربيات 🏎️</h1>

  <section class="setup" id="s-mode">
    <p><a href="/">← رجوع للألعاب</a></p>
    <p>دوس على الشاشة بأسرع ما تقدر، وكل ضغطة بتحرّك عربيتك. أول واحد يوصل لخط النهاية يكسب!</p>
    <button class="act" id="m-same">📱 إحنا الاتنين على نفس التليفون</button>
    <button class="act" id="m-online">🌐 كل واحد في تليفون (محتاج نت)</button>
    <button class="act" id="m-ai">🤖 ضد الكمبيوتر</button>
  </section>

  <section class="setup" id="s-diff" hidden>
    <p>اختار الصعوبة</p>
    <button class="act" data-d="easy">سهل 🟢</button>
    <button class="act" data-d="mid">متوسط 🟡</button>
    <button class="act" data-d="hard">صعب 🔴</button>
    <button class="act alt" id="diff-back">رجوع</button>
  </section>

  <section class="setup" id="s-name" hidden>
    <label for="name">اسمك إيه؟</label>
    <input id="name" maxlength="12" placeholder="مثلاً: برعي" autocomplete="off">
    <button class="act" id="create">إنشاء غرفة جديدة</button>
    <label for="code">أو ادخل غرفة صاحبك بالكود</label>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="مثلاً: 4821" autocomplete="off">
    <button class="act alt" id="join">دخول الغرفة</button>
    <button class="act alt" id="name-back">رجوع</button>
    <p class="err" id="err"></p>
  </section>

  <section id="s-wait" hidden>
    <p>كود غرفتك</p>
    <div class="code" id="roomcode"></div>
    <p>ابعت الكود لصاحبك واستنى لحد ما يدخل...</p>
  </section>
</main>

<section id="s-race" hidden>
  <div id="top">
    <button id="exit">← رجوع</button>
    <span id="score"></span>
  </div>
  <div id="track">
    <div class="lane l0" id="l0" data-i="0"><div class="finish"></div><div class="lname" id="n0"></div><div class="car" id="c0"></div><div class="hint" id="h0"></div></div>
    <div class="lane l1" id="l1" data-i="1"><div class="finish"></div><div class="lname" id="n1"></div><div class="car" id="c1"></div><div class="hint" id="h1"></div></div>
    <div id="overlay"></div>
  </div>
  <div id="after" hidden>
    <button class="act" id="again">جولة جديدة</button>
    <button class="act" id="back">رجوع للقائمة</button>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const TARGET = 50; // عدد الضغطات اللي توصّل العربية لخط النهاية
const DIFF = { easy: { base: 300, jit: 160 }, mid: { base: 210, jit: 110 }, hard: { base: 150, jit: 90 } };

let mode = "same", AI = DIFF.mid, me = 0, socket = null;
let pos = [0, 0], target = TARGET, scores = [0, 0], lname = ["", ""];
let running = false, over = false, aiTimer = null, cd = [];

function car(color) {
  return '<svg viewBox="0 0 44 80" width="44" height="80" aria-hidden="true">' +
    '<rect x="0" y="10" width="7" height="18" rx="2" fill="#222"/><rect x="37" y="10" width="7" height="18" rx="2" fill="#222"/>' +
    '<rect x="0" y="52" width="7" height="18" rx="2" fill="#222"/><rect x="37" y="52" width="7" height="18" rx="2" fill="#222"/>' +
    '<rect x="4" y="2" width="36" height="76" rx="14" fill="' + color + '" stroke="#000" stroke-opacity=".4" stroke-width="2"/>' +
    '<rect x="10" y="20" width="24" height="15" rx="4" fill="#cfeaff"/><rect x="10" y="50" width="24" height="10" rx="4" fill="#cfeaff"/>' +
    '<rect x="18" y="2" width="8" height="12" rx="3" fill="#fff" fill-opacity=".35"/></svg>';
}
$("c0").innerHTML = car("#c1121f");
$("c1").innerHTML = car("#1b7f3b");

function show(id) {
  ["s-mode", "s-diff", "s-name", "s-wait"].forEach(s => $(s).hidden = s !== id);
}

// ---------- الرسم ----------
function render() {
  [0, 1].forEach(i => {
    const lane = $("l" + i);
    const travel = Math.max(0, lane.clientHeight - 80 - 40 - 28);
    $("c" + i).style.transform = "translateY(" + (-travel * Math.min(1, pos[i] / target)) + "px)";
    lane.style.backgroundPositionY = (pos[i] * 22) + "px";
  });
  $("score").textContent = "🔴 " + scores[0] + " : " + scores[1] + " 🟢";
  const early = pos[0] <= 2 && pos[1] <= 2;
  $("h0").style.visibility = $("h1").style.visibility = early ? "visible" : "hidden";
}
window.addEventListener("resize", render);

function setLabels() {
  if (mode === "same") {
    lname = ["🔴 الأحمر", "🟢 الأخضر"];
    $("h0").textContent = $("h1").textContent = "👆 دوس هنا بسرعة";
  } else if (mode === "ai") {
    lname = ["أنت 🔴", "الكمبيوتر 🤖 🟢"];
    $("h0").textContent = "👆 دوس في أي مكان بسرعة"; $("h1").textContent = "";
  } else {
    $("h0").textContent = "👆 دوس في أي مكان بسرعة"; $("h1").textContent = "";
  }
  $("n0").textContent = lname[0]; $("n1").textContent = lname[1];
}

function say(t, small) {
  $("overlay").textContent = t;
  $("overlay").className = small ? "small" : "";
}

// ---------- الجولة ----------
function startRound(startIn) {
  cd.forEach(clearTimeout); cd = [];
  clearTimeout(aiTimer);
  over = false; running = false; pos = [0, 0];
  $("after").hidden = true;
  render();
  const step = startIn / 3;
  ["3", "2", "1"].forEach((t, i) => cd.push(setTimeout(() => say(t), i * step)));
  cd.push(setTimeout(() => {
    say("انطلق! 🏁"); running = true;
    if (mode === "ai") aiLoop();
    cd.push(setTimeout(() => say(""), 700));
  }, startIn));
  say("جاهز؟");
}

function aiLoop() {
  if (!running || mode !== "ai") return;
  aiTimer = setTimeout(() => {
    if (!running) return;
    pos[1]++; render();
    if (pos[1] >= target) return finish(1, true);
    aiLoop();
  }, AI.base + Math.random() * AI.jit);
}

function tap(side) {
  if (!running) return;
  if (mode === "online") { socket.emit("race:tap"); return; }
  pos[side]++; render();
  if (pos[side] >= target) finish(side, true);
}

function finish(w, inc) {
  if (over) return;
  over = true; running = false;
  clearTimeout(aiTimer);
  if (inc) scores[w]++;
  render();
  let t;
  if (mode === "same") t = w === 0 ? "🔴 الأحمر كسب! 🏆" : "🟢 الأخضر كسب! 🏆";
  else t = w === 0 ? "كسبت! 🏆" : lname[1].replace(/ ?[🟢🔴🤖]/gu, "") + " كسب 😅";
  say(t, true);
  $("again").hidden = false;
  $("after").hidden = false;
}

$("track").addEventListener("pointerdown", e => {
  e.preventDefault();
  if (!running) return;
  if (mode === "same") {
    const l = e.target.closest ? e.target.closest(".lane") : null;
    if (l) tap(+l.dataset.i);
  } else tap(0);
});

function enterRace(startIn) {
  $("menu").hidden = true; $("s-race").hidden = false;
  scores = [0, 0];
  setLabels();
  if (startIn) startRound(startIn);
}

// ---------- الأوضاع ----------
$("m-same").onclick = () => { mode = "same"; enterRace(3000); };
$("m-ai").onclick = () => show("s-diff");
$("m-online").onclick = () => show("s-name");
$("diff-back").onclick = () => show("s-mode");
$("name-back").onclick = () => show("s-mode");
document.querySelectorAll("[data-d]").forEach(b => {
  b.onclick = () => { mode = "ai"; AI = DIFF[b.dataset.d]; enterRace(3000); };
});

$("again").onclick = () => {
  if (mode === "online") socket.emit("race:again");
  else startRound(3000);
};
$("back").onclick = () => location.reload();
$("exit").onclick = () => location.reload();

// ---------- اللعب أونلاين ----------
// مكتبة الاتصال بتتحمل هنا بس، عشان الأوضاع التانية تشتغل بدون نت
function withSocket(cb) {
  if (socket) return cb();
  const s = document.createElement("script");
  s.src = "/socket.io/socket.io.js";
  s.onload = () => { socket = io(); bindSocket(); cb(); };
  s.onerror = () => { $("err").textContent = "مفيش إنترنت. الوضع ده محتاج نت."; };
  document.head.appendChild(s);
}
function getName() {
  const n = $("name").value.trim();
  if (!n) { $("err").textContent = "اكتب اسمك الأول"; $("name").focus(); return null; }
  $("err").textContent = "";
  return n;
}
$("create").onclick = () => { const n = getName(); if (n) withSocket(() => socket.emit("race:create", n)); };
$("join").onclick = () => {
  const n = getName();
  if (n) withSocket(() => socket.emit("race:join", { code: $("code").value.trim(), name: n }));
};

function bindSocket() {
  socket.on("race:created", c => { $("roomcode").textContent = c; show("s-wait"); });
  socket.on("race:fail", m => { $("err").textContent = m; });
  socket.on("race:start", d => {
    mode = "online";
    me = d.ids.indexOf(socket.id);
    lname = [d.names[me] + " 🔴", d.names[1 - me] + " 🟢"];
    enterRace(0);
  });
  socket.on("race:round", d => startRound(d.startIn));
  socket.on("race:state", s => {
    target = s.target;
    pos = [s.pos[me], s.pos[1 - me]];
    if (s.over) {
      scores = [s.scores[me], s.scores[1 - me]];
      finish(s.winner === me ? 0 : 1, false);
    } else render();
  });
  socket.on("race:left", () => {
    running = false; over = true;
    say(lname[1].replace(/ ?[🟢🔴]/gu, "") + " خرج من اللعبة", true);
    $("again").hidden = true;
    $("after").hidden = false;
  });
}
</script>
</body>
</html>
