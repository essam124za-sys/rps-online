<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background: #0c1836; display: flex; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #track { display: flex; width: 100%; max-width: 600px; height: 100%; background: #333; position: relative; border-left: 5px dashed #fff; border-right: 5px dashed #fff; }
        .lane { flex: 1; position: relative; }
        .lane:first-child { border-left: 2px solid red; background: #a83232; }
        .lane:last-child { border-right: 2px solid green; background: #32a852; }
        .car { width: 50px; height: 100px; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); border-radius: 10px; }
        #player-car { background: linear-gradient(to bottom, #ff3333, #800000); box-shadow: 0 0 10px yellow; }
        #ai-car { background: linear-gradient(to bottom, #33ff33, #008000); box-shadow: 0 0 10px white; }
        .label { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); color: white; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="track">
    <div class="lane">
        <div class="label">أنت</div>
        <div id="player-car" class="car"></div>
    </div>
    <div class="lane">
        <div class="label">الكمبيوتر</div>
        <div id="ai-car" class="car"></div>
    </div>
</div>

<script>
    console.log("تم تحميل العربيات بنجاح");
</script>

</body>
</html>
