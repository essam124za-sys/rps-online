<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حجر ورقة مقص</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
:root{--bg:#fdf6e3;--ink:#14213d;--card:#fff;--a:#2ec4b6;--b:#ff5d8f;--mut:#5b6478}
@media (prefers-color-scheme:dark){:root{--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px;text-align:center}
h1{font-size:2.2rem;font-weight:800;margin:4px 0 12px}
.setup{display:grid;gap:10px;margin-top:20px}
.setup label{text-align:start;font-weight:800}
input{font:inherit;width:100%;padding:12px;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font-size:1.15rem}
button{font:inherit;color:var(--ink);cursor:pointer}
.act{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px;font-size:1.2rem;font-weight:800}
.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.err{color:var(--b);font-weight:800;min-height:1.5em;margin:0}
.code{font-size:4rem;font-weight:800;letter-spacing:.2em;direction:ltr;margin:10px 0}
.score{display:flex;justify-content:space-between;color:var(--mut);font-weight:500;margin-bottom:16px}
.score b{color:var(--ink);font-size:1.2rem}
.table{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slot p{margin:8px 0 0;font-weight:800}
.slot.win .card{outline:4px solid var(--b);outline-offset:4px;border-radius:16px}
.card{position:relative;width:100%;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .6s}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:16px;font-size:3.6rem;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:var(--a);color:#fff;font-weight:800}
.front{background:var(--card);transform:rotateY(180deg);border:2px solid var(--ink)}
.msg{min-height:3.2em;font-size:1.15rem;font-weight:800;margin:18px 0 12px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.picks button{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px 4px;font-size:2.2rem;line-height:1.1}
.picks small{display:block;font-size:.95rem;font-weight:800;margin-top:4px}
button:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>حجر ورقة مقص</h1>

  <section class="setup" id="s-mode">
    <p><a href="/" style="color:var(--mut)">← رجوع للألعاب</a></p>
    <button class="act" id="m-ai">🤖 العب ضد الكمبيوتر</button>
    <button class="act alt" id="m-friend">👥 العب مع صديق</button>
  </section>

  <section class="setup" id="s-name" hidden>
    <label for="name">اسمك إيه؟</label>
    <input id="name" maxlength="12" placeholder="مثلاً: برعي" autocomplete="off">
    <button class="act" id="create">إنشاء غرفة جديدة</button>
    <label for="code">أو ادخل غرفة صاحبك بالكود</label>
    <input id="code" inputmode="numeric" maxlength="4" placeholder="مثلاً: 4821" autocomplete="off">
    <button class="act alt" id="join">دخول الغرفة</button>
    <button class="act alt" id="to-mode">رجوع</button>
    <p class="err" id="err"></p>
  </section>

  <section id="s-wait" hidden>
    <p>كود غرفتك</p>
    <div class="code" id="roomcode"></div>
    <p>ابعت الكود لصاحبك واستنى لحد ما يدخل...</p>
  </section>

  <section id="s-game" hidden>
    <div class="score">
      <span><span id="n-me"></span>: <b id="s-me">0</b></span>
      <span>تعادل: <b id="s-draw">0</b></span>
      <span><span id="n-opp"></span>: <b id="s-opp">0</b></span>
    </div>
    <div class="table">
      <div class="slot" id="slot-me"><div class="card" id="c-me"><div class="face back" id="b-me">؟</div><div class="face front" id="f-me"></div></div><p id="p-me"></p></div>
      <div class="slot" id="slot-opp"><div class="card" id="c-opp"><div class="face back" id="b-opp">؟</div><div class="face front" id="f-opp"></div></div><p id="p-opp"></p></div>
    </div>
    <p class="msg" id="msg"></p>
    <div class="picks" id="picks">
      <button data-p="rock">✊<small>حجر</small></button>
      <button data-p="paper">✋<small>ورقة</small></button>
      <button data-p="scissors">✌️<small>مقص</small></button>
    </div>
    <button class="act" id="act" hidden>جولة جديدة</button>
    <button class="act alt" id="home" style="margin-top:12px">رجوع للقائمة</button>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);
const EMOJI = { rock: "✊", paper: "✋", scissors: "✌️" };
const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
let me = 0, names = ["", ""], phase = "wait", mode = "friend", aiScore = [0, 0, 0];

function show(id) {
  ["s-mode", "s-name", "s-wait", "s-game"].forEach(s => $(s).hidden = s !== id);
}
function setNames() {
  $("n-me").textContent = $("p-me").textContent = names[me];
  $("n-opp").textContent = $("p-opp").textContent = names[1 - me];
}

// اختيار الوضع
$("m-friend").onclick = () => { mode = "friend"; show("s-name"); };
$("to-mode").onclick = () => show("s-mode");
$("home").onclick = () => location.reload();
$("m-ai").onclick = () => {
  mode = "ai"; me = 0; names = ["أنت", "الكمبيوتر"]; aiScore = [0, 0, 0];
  setNames();
  ["s-me", "s-opp", "s-draw"].forEach(id => $(id).textContent = "0");
  show("s-game");
  newRound();
};

// اللعب مع صديق
function getName() {
  const n = $("name").value.trim();
  if (!n) { $("err").textContent = "اكتب اسمك الأول"; $("name").focus(); return null; }
  return n;
}
$("create").onclick = () => { const n = getName(); if (n) socket.emit("create", n); };
$("join").onclick = () => {
  const n = getName();
  if (n) socket.emit("join", { code: $("code").value.trim(), name: n });
};
socket.on("created", c => { $("roomcode").textContent = c; show("s-wait"); });
socket.on("fail", m => { $("err").textContent = m; });
socket.on("start", data => {
  names = data.names;
  me = data.ids.indexOf(socket.id);
  setNames();
  show("s-game");
  newRound();
});

function newRound() {
  phase = "pick";
  ["me", "opp"].forEach(k => {
    $("c-" + k).classList.remove("flipped");
    $("slot-" + k).classList.remove("win");
    $("b-" + k).textContent = "؟";
  });
  $("act").hidden = true;
  $("picks").hidden = false;
  $("msg").textContent = "اختار!";
}

// مين اختار (من غير ما نعرف اختار إيه)
socket.on("picked", st => {
  $("b-me").textContent = st[me] ? "✓" : "؟";
  $("b-opp").textContent = st[1 - me] ? "✓" : "؟";
  if (phase === "pick") {
    $("picks").hidden = st[me];
    $("msg").textContent = st[me] ? "استنى " + names[1 - me] + " يختار..." : "اختار!";
  }
});

// اختيار اللاعب
document.querySelectorAll("[data-p]").forEach(b => {
  b.onclick = () => {
    if (mode === "ai") aiPick(b.dataset.p);
    else socket.emit("pick", b.dataset.p);
  };
});

// الكمبيوتر بيختار عشوائي
function aiPick(c) {
  $("picks").hidden = true;
  $("b-me").textContent = "✓";
  $("msg").textContent = "الكمبيوتر بيفكر...";
  setTimeout(() => {
    const k = ["rock", "paper", "scissors"];
    const o = k[Math.floor(Math.random() * 3)];
    const w = c === o ? 2 : BEATS[c] === o ? 0 : 1;
    aiScore[w]++;
    onResult({ picks: [c, o], winner: w, scores: aiScore.slice() });
  }, 700);
}

function onResult(r) {
  phase = "result";
  $("f-me").textContent = EMOJI[r.picks[me]];
  $("f-opp").textContent = EMOJI[r.picks[1 - me]];
  ["me", "opp"].forEach(k => $("c-" + k).classList.add("flipped"));
  $("s-me").textContent = r.scores[me];
  $("s-opp").textContent = r.scores[1 - me];
  $("s-draw").textContent = r.scores[2];
  $("picks").hidden = true;
  if (r.winner === 2) {
    $("msg").textContent = "تعادل!";
  } else {
    if (mode === "ai") $("msg").textContent = r.winner === 0 ? "كسبت! 🎉" : "الكمبيوتر كسب 😅";
    else $("msg").textContent = names[r.winner] + " كسب 🎉";
    $("slot-" + (r.winner === me ? "me" : "opp")).classList.add("win");
  }
  $("act").hidden = false;
}
socket.on("result", onResult);

$("act").onclick = () => {
  newRound();
  if (mode !== "ai") socket.emit("again");
};

socket.on("left", () => {
  phase = "over";
  $("msg").textContent = names[1 - me] + " خرج من اللعبة";
  $("picks").hidden = true;
  $("act").hidden = false;
  $("act").textContent = "رجوع للبداية";
  $("act").onclick = () => location.reload();
});
</script>
</body>
</html>
