<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وصّل الفواكه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
:root{--bg:#fdf6e3;--ink:#14213d;--card:#fff;--b:#ff5d8f;--mut:#5b6478;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14213d;--ink:#fdf6e3;--card:#22335c;--mut:#aab4cc;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:2rem;font-weight:800;margin:4px 0 8px}
.hint{color:var(--mut);margin:0 0 16px}
button{font:inherit;color:var(--ink);cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:10px 4px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-weight:800}.tabs button.on{background:var(--ink);color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.levels button{aspect-ratio:1;background:var(--card);border:2px solid var(--ink);border-radius:14px;font-size:1.4rem;font-weight:800}
.levels button:disabled{opacity:.35;cursor:not-allowed}
.levels button.done{background:var(--b);color:#fff;border-color:var(--b)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:transparent;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800}
#cv{display:block;margin:0 auto;background:var(--card);border-radius:18px;border:2px solid var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.msg{min-height:3em;font-size:1.2rem;font-weight:800;margin:14px 0 8px}
.act{width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px;font-size:1.2rem;font-weight:800}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>وصّل الفواكه 🍓</h1>
  <section id="menu">
    <p class="hint"><a href="/" style="color:var(--mut)">← رجوع للألعاب</a></p>
    <p class="hint">اختار المستوى، ووصّل كل فاكهة بشبيهتها من غير ما الخطوط تتلامس</p>
    <div class="tabs" id="tabs"></div>
    <div class="levels" id="levels"></div>
  </section>
  <section id="play" hidden>
    <div class="bar"><button id="back">المراحل</button><b id="lvl"></b><b id="tm"></b><button id="reset">إعادة</button></div>
    <canvas id="cv"></canvas>
    <p class="msg" id="msg"></p>
    <button class="act" id="next" hidden>المرحلة التالية</button>
  </section>
</main>
<script>
const EASY=[[3,[[[0,2],[2,1]],[[0,0],[2,0]]]],[4,[[[0,2],[1,1]],[[3,2],[1,3]]]],[4,[[[3,0],[0,1]],[[2,2],[2,1]],[[1,3],[3,1]]]],[4,[[[0,2],[1,1]],[[2,2],[2,0]],[[3,3],[3,0]],[[0,3],[2,3]]]],[5,[[[3,1],[2,3]],[[0,3],[1,1]],[[2,4],[4,1]]]],[5,[[[3,0],[0,0]],[[0,4],[0,2]],[[4,2],[3,3]],[[3,2],[2,4]]]],[5,[[[1,3],[1,1]],[[0,4],[2,4]],[[3,0],[4,1]],[[2,1],[2,3]],[[3,4],[4,2]]]],[6,[[[1,1],[1,3]],[[0,3],[2,5]],[[4,5],[2,2]],[[0,0],[4,0]]]],[6,[[[2,4],[4,5]],[[5,0],[4,0]],[[0,5],[1,5]],[[2,1],[0,1]],[[5,5],[3,3]]]],[6,[[[0,1],[1,1]],[[5,2],[4,0]],[[4,4],[3,1]],[[1,4],[2,2]],[[0,5],[3,4]],[[5,3],[4,5]]]]];
const MED=[[5,[[[3,2],[4,1]],[[0,3],[3,4]],[[3,3],[1,2]],[[0,0],[0,1]]]],[5,[[[2,0],[0,3]],[[1,2],[1,4]],[[2,1],[3,3]],[[4,4],[4,2]],[[4,1],[3,0]]]],[6,[[[0,1],[2,0]],[[0,5],[1,2]],[[4,3],[2,2]],[[1,4],[4,4]],[[4,0],[4,2]]]],[6,[[[4,4],[2,1]],[[0,0],[3,2]],[[5,3],[1,4]],[[1,3],[1,5]],[[4,0],[1,1]]]],[6,[[[5,4],[4,2]],[[2,0],[3,1]],[[3,4],[5,5]],[[2,3],[3,5]],[[4,0],[4,1]],[[3,2],[0,1]]]],[6,[[[2,1],[5,1]],[[0,2],[2,4]],[[4,1],[3,3]],[[5,2],[5,5]],[[2,3],[1,3]],[[2,0],[1,1]]]],[7,[[[4,5],[3,3]],[[6,4],[5,6]],[[4,3],[5,3]],[[2,0],[1,4]],[[1,2],[1,3]],[[1,6],[1,5]]]],[7,[[[2,0],[3,2]],[[5,2],[6,0]],[[4,5],[0,5]],[[5,4],[3,5]],[[1,1],[2,4]],[[2,5],[0,3]]]],[7,[[[0,6],[0,5]],[[5,1],[5,4]],[[0,4],[3,3]],[[6,3],[2,0]],[[2,4],[4,4]],[[6,5],[4,5]],[[3,2],[4,1]]]],[7,[[[3,5],[1,4]],[[6,2],[5,0]],[[4,5],[4,3]],[[1,5],[2,5]],[[3,1],[4,0]],[[3,6],[6,3]],[[3,2],[0,2]]]]];
const HARD=[[7,[[[3,4],[5,4]],[[1,1],[0,2]],[[5,3],[2,6]],[[0,4],[1,4]],[[4,4],[5,1]],[[4,0],[6,2]],[[3,0],[0,1]]]],[7,[[[4,2],[3,5]],[[0,1],[0,3]],[[4,1],[1,0]],[[3,6],[1,5]],[[6,4],[5,0]],[[4,6],[6,5]],[[2,2],[3,4]],[[6,3],[6,0]]]],[8,[[[7,7],[3,7]],[[7,1],[2,1]],[[5,5],[2,5]],[[3,2],[1,3]],[[4,5],[1,5]],[[5,2],[7,3]],[[5,0],[0,0]]]],[8,[[[2,1],[7,2]],[[4,6],[1,7]],[[4,5],[1,5]],[[1,1],[3,2]],[[5,1],[6,4]],[[7,5],[6,5]],[[1,6],[1,4]],[[4,3],[5,5]]]],[8,[[[0,4],[1,6]],[[3,2],[3,5]],[[0,1],[3,1]],[[4,1],[7,0]],[[7,1],[6,3]],[[3,6],[4,4]],[[6,7],[5,6]],[[1,4],[1,2]]]],[8,[[[3,7],[6,6]],[[4,4],[5,0]],[[1,5],[1,2]],[[3,0],[3,5]],[[0,2],[0,7]],[[7,4],[6,0]],[[2,2],[0,1]],[[5,7],[4,5]]]],[8,[[[7,3],[5,1]],[[3,4],[5,7]],[[6,7],[5,5]],[[1,4],[2,6]],[[2,1],[4,2]],[[2,0],[0,2]],[[4,3],[5,2]],[[2,5],[0,3]]]],[8,[[[6,1],[3,3]],[[5,0],[5,1]],[[2,7],[0,4]],[[6,7],[7,7]],[[7,1],[7,4]],[[0,2],[1,0]],[[4,6],[4,3]],[[1,4],[3,7]]]],[8,[[[7,5],[4,5]],[[3,0],[0,2]],[[2,7],[4,6]],[[1,3],[5,4]],[[0,7],[0,6]],[[7,3],[5,1]],[[2,1],[1,1]],[[5,3],[5,0]]]],[8,[[[0,0],[3,2]],[[5,5],[4,4]],[[4,7],[7,5]],[[1,4],[1,1]],[[6,1],[6,5]],[[3,7],[2,7]],[[4,0],[7,2]],[[1,2],[2,4]]]]];
const LVS=[EASY,MED,HARD];
const F=["🍎","🍊","🍇","🍓","🍌","🍉","🍋","🥝"];
const C=["#e63946","#f77f00","#7b2cbf","#e75480","#d4a017","#2a9d8f","#8a9a00","#3f7d20"];
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
let LV=LVS[0],diff=0,unlocked=1,cur=0,n=0,W,cell,R,LW,SEP,E=[],pts=[],fin=[],st=[],drawing=null,t0=0,timer=null;
const key=()=>"fruits_u"+diff;
function load(){unlocked=1;try{unlocked=+localStorage.getItem(key())||1}catch(e){}}

function menu(){
  clearInterval(timer);
  $("play").hidden=true;$("menu").hidden=false;
  $("tabs").innerHTML="";
  ["سهل 🟢","متوسط 🟡","صعب 🔴"].forEach((nm,d)=>{
    const b=document.createElement("button");b.textContent=nm;
    if(d===diff)b.classList.add("on");
    b.onclick=()=>{diff=d;LV=LVS[d];load();menu()};
    $("tabs").appendChild(b);
  });
  $("levels").innerHTML="";
  LV.forEach((_,i)=>{
    const b=document.createElement("button");
    b.textContent=i+1;b.disabled=i>=unlocked;
    if(i<unlocked-1)b.classList.add("done");
    b.onclick=()=>start(i);$("levels").appendChild(b);
  });
}
function start(i){
  cur=i;n=LV[i][0];drawing=null;
  clearInterval(timer);t0=Date.now();$("tm").textContent="0 ث";
  timer=setInterval(()=>{$("tm").textContent=Math.floor((Date.now()-t0)/1000)+" ث"},1000);
  $("menu").hidden=true;$("play").hidden=false;
  $("lvl").textContent="المرحلة "+(i+1)+" من "+LV.length;
  $("msg").textContent="اسحب بإصبعك من فاكهة لشبيهتها";$("next").hidden=true;
  W=Math.min(innerWidth*0.92,420);const dpr=devicePixelRatio||1;
  cv.style.width=cv.style.height=W+"px";cv.width=cv.height=W*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cell=W/n;R=cell*0.36;LW=cell*0.2;SEP=LW*1.3;
  E=LV[i][1].map(p=>p.map(q=>[(q[1]+0.5)*cell,(q[0]+0.5)*cell]));
  pts=E.map(()=>[]);fin=E.map(()=>false);st=E.map(()=>0);
  draw();
}
function draw(){
  ctx.clearRect(0,0,W,W);
  ctx.lineCap=ctx.lineJoin="round";ctx.lineWidth=LW;
  pts.forEach((p,i)=>{
    if(p.length<2)return;
    ctx.strokeStyle=C[i];ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);
    p.forEach(q=>ctx.lineTo(q[0],q[1]));ctx.stroke();
  });
  ctx.font=(R*1.7)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
  E.forEach((e,i)=>e.forEach(c=>{
    ctx.fillStyle="rgba(255,255,255,.75)";ctx.beginPath();ctx.arc(c[0],c[1],R,0,7);ctx.fill();
    ctx.fillStyle="#000";ctx.fillText(F[i],c[0],c[1]+R*0.08);
  }));
}
function ok(q,i){
  if(q[0]<LW/2||q[1]<LW/2||q[0]>W-LW/2||q[1]>W-LW/2)return false;
  for(let j=0;j<E.length;j++){
    if(j===i)continue;
    if(pts[j].some(p=>dist(p,q)<SEP))return false;
    if(E[j].some(c=>dist(c,q)<R*0.85+LW/2))return false;
  }
  return true;
}
const xy=ev=>{const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top]};
cv.addEventListener("pointerdown",ev=>{
  const m=xy(ev);
  for(let i=0;i<E.length;i++){
    const p=pts[i];
    if(!fin[i]&&p.length>1&&dist(p[p.length-1],m)<R*1.2){drawing=i;cv.setPointerCapture(ev.pointerId);return}
  }
  for(let i=0;i<E.length;i++)for(let k=0;k<2;k++){
    if(dist(E[i][k],m)<R*1.2){drawing=i;st[i]=k;pts[i]=[E[i][k]];fin[i]=false;cv.setPointerCapture(ev.pointerId);draw();return}
  }
});
cv.addEventListener("pointermove",ev=>{
  if(drawing===null)return;
  const m=xy(ev),p=pts[drawing],last=p[p.length-1];
  const steps=Math.ceil(dist(last,m)/(LW*0.4));
  for(let s=1;s<=steps;s++){
    const q=[last[0]+(m[0]-last[0])*s/steps,last[1]+(m[1]-last[1])*s/steps];
    if(!ok(q,drawing))break;
    p.push(q);
    const tw=E[drawing][1-st[drawing]];
    if(dist(q,tw)<R*0.9){p.push(tw);fin[drawing]=true;drawing=null;break}
  }
  draw();
});
function end(){
  drawing=null;
  if(fin.every(Boolean)){
    unlocked=Math.max(unlocked,Math.min(cur+2,LV.length));
    try{localStorage.setItem(key(),unlocked)}catch(e){}
    clearInterval(timer);const sec=Math.floor((Date.now()-t0)/1000);
    const last=cur===LV.length-1;
    $("msg").textContent=(last?"برافو! خلصت المستوى كله 🏆":"برافو! 🎉")+" في "+sec+" ثانية";
    $("next").hidden=last;
  }
}
cv.addEventListener("pointerup",end);
cv.addEventListener("pointercancel",end);
$("next").onclick=()=>start(cur+1);
$("reset").onclick=()=>start(cur);
$("back").onclick=menu;
load();menu();
</script>
</body>
</html>
